name: CI

# Une seule exécution par commit (les PR via pull_request, main via push),
# et une exécution dépassée par un nouveau commit est annulée : la CI reste
# rapide et sobre (et tiendrait dans le forfait d'un dépôt privé).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  test:
    name: Analyse et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: verger_core
        working-directory: packages/verger_core
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos
          dart test
      - name: verger_data
        working-directory: packages/verger_data
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos
          dart test
      - name: PDFium (tests des outils PDF)
        run: |
          mkdir -p "$RUNNER_TEMP/pdfium"
          curl -sSLf "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7811/pdfium-linux-x64.tgz" | tar -xz -C "$RUNNER_TEMP/pdfium"
          echo "PDFIUM_PATH=$RUNNER_TEMP/pdfium/lib/libpdfium.so" >> "$GITHUB_ENV"
      - name: app
        working-directory: app
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test

  windows:
    name: Exécutable Windows
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: verger-windows
          path: app/build/windows/x64/runner/Release/
          # Sur main, la release « dernier » reprend l'exécutable aussitôt.
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 1 }}
      # Lien direct vers l'exécutable dans la PR (un seul commentaire, mis à
      # jour à chaque compilation).
      - name: Lien dans la PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const marker = '<!-- verger-windows -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              `**Exécutable Windows** (commit ${sha}) : [télécharger verger-windows.zip](${process.env.ARTIFACT_URL})`,
              '',
              'Décompresser puis lancer `verger.exe`. Lien valable 7 jours, connexion à GitHub requise.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find((c) => c.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # À chaque fusion dans main : l'exécutable est republié sous la release
  # « dernier », à une adresse fixe :
  # https://github.com/<dépôt>/releases/latest/download/verger-windows.zip
  release:
    name: Release « dernier »
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-dernier
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verger-windows
          path: verger
      - name: Archive
        run: cd verger && zip -qr ../verger-windows.zip .
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete dernier --cleanup-tag --yes || true
          gh release create dernier verger-windows.zip \
            --target "$GITHUB_SHA" --latest \
            --title "Verger — dernière version" \
            --notes "Version de main au commit ${GITHUB_SHA::7}. Décompresser puis lancer verger.exe."

  # Les machines macOS coûtent 10 fois plus de minutes : le job TestFlight ne
  # démarre que si les secrets Apple sont configurés (vérifié sur Linux).
  apple:
    name: Secrets Apple
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          manquants=""
          for s in IOS_P12_BASE64 IOS_P12_PASSWORD IOS_PROFILE_BASE64 \
                   ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!s}" ] || manquants="$manquants $s"
          done
          if [ -z "$manquants" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # Envoi demandé à la main : l'échec doit se voir.
            echo "::error::Secrets Apple absents ou vides :$manquants (voir docs/TESTFLIGHT.md, étape 7)."
            exit 1
          else
            echo "::notice::Secrets Apple absents ou vides :$manquants : pas d'envoi à TestFlight (voir docs/TESTFLIGHT.md)."
          fi

  # Appli iPad envoyée à TestFlight à chaque fusion dans main (ou à la
  # demande, depuis l'onglet Actions). Configuration : docs/TESTFLIGHT.md.
  testflight:
    name: TestFlight (iPad)
    needs: [test, apple]
    if: needs.apple.outputs.ready == 'true'
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Secrets Apple présents ?
        id: secrets
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
        run: |
          if [ -n "$IOS_P12_BASE64" ] && [ -n "$ASC_KEY_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Secrets Apple absents : compilation sans signature, pas d'envoi (voir docs/TESTFLIGHT.md)."
          fi
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Certificat, profil et clé App Store Connect
        if: steps.secrets.outputs.ready
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/verger.keychain-db"
          motdepasse="$(openssl rand -hex 16)"
          echo "$IOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/verger.p12"
          security create-keychain -p "$motdepasse" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$motdepasse" "$keychain"
          security import "$RUNNER_TEMP/verger.p12" -P "$IOS_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$motdepasse" "$keychain"
          security list-keychain -d user -s "$keychain"

          # Profil : nommé par son UUID, dans le dossier de Xcode 16 et plus
          # comme dans l'ancien. Son nom, son équipe et son App ID sont
          # affichés (rien de secret) pour diagnostiquer une erreur de profil.
          profil="$RUNNER_TEMP/verger.mobileprovision"
          echo "$IOS_PROFILE_BASE64" | base64 --decode > "$profil"
          security cms -D -i "$profil" > "$RUNNER_TEMP/profil.plist"
          lire() { /usr/libexec/PlistBuddy -c "Print :$1" "$RUNNER_TEMP/profil.plist"; }
          nom="$(lire Name)"
          echo "Profil : « $nom », équipe $(lire TeamIdentifier:0)," \
            "App ID $(lire Entitlements:application-identifier)," \
            "expire le $(lire ExpirationDate)"
          if [ "$nom" != "Verger App Store" ]; then
            echo "::error::Le profil s'appelle « $nom » au lieu de « Verger App Store » (docs/TESTFLIGHT.md, étape 5)."
            exit 1
          fi
          # Team ID : celui du profil (public, il figure dans toute appli
          # signée), pour les étapes suivantes.
          echo "APPLE_TEAM_ID=$(lire TeamIdentifier:0)" >> "$GITHUB_ENV"
          uuid="$(lire UUID)"
          for profils in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                         "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$profils"
            cp "$profil" "$profils/$uuid.mobileprovision"
          done

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Compilation de l'appli signée
        if: steps.secrets.outputs.ready
        working-directory: app
        run: |
          # APPLE_TEAM_ID vient de GITHUB_ENV (étape précédente).
          export FLUTTER_XCODE_DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>io.github.thibaudf103.verger</key><string>Verger App Store</string>
            </dict>
          </dict></plist>
          PLIST
          flutter pub get
          flutter build ipa --release \
            --build-number=${{ github.run_number }} \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
      - name: Envoi à TestFlight
        if: steps.secrets.outputs.ready
        working-directory: app
        run: |
          xcrun altool --upload-app --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Nettoyage du trousseau
        if: always() && steps.secrets.outputs.ready
        run: security delete-keychain "$RUNNER_TEMP/verger.keychain-db" || true

name: verger
description: "Verger de connaissances : suivi de progression et répétition espacée."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  archive: ^4.5.2
  crypto: ^3.0.7
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_math_fork: ^0.7.4
  http: ^1.6.0
  pdfrx: ^2.6.5
  url_launcher: ^6.3.3
  verger_core:
    path: ../packages/verger_core
  verger_data:
    path: ../packages/verger_data
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/samples/
